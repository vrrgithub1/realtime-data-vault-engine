name: realtime-dv-engine

networks:
  redpanda_net:
    driver: bridge

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: redpanda
    networks:
      - redpanda_net
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "18082:18082"
      - "19092:19092"
      - "18081:18081"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.3
    container_name: redpanda-console
    restart: on-failure
    networks:
      - redpanda_net
    volumes:
      - ./console-config.yaml:/etc/redpanda/console-config.yaml
    environment:
      CONFIG_FILEPATH: /etc/redpanda/console-config.yaml
    ports:
      - "8080:8080"
    depends_on:
      - redpanda