name: dbt Data Vault CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  dbt_transformation_ci:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-snowflake

      - name: Setup dbt Profile Configuration
        run: |
          mkdir -p ~/.dbt
          cat << 'EOF' > ~/.dbt/profiles.yml
          transform:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
                role: ACCOUNTADMIN
                warehouse: REALTIME_DV_WH
                database: REALTIME_DV_DB
                schema: STAGING
                threads: 4
          EOF

      - name: Test Snowflake Connection (dbt debug)
        run: |
          cd transform
          dbt debug

      - name: Execute dbt Transformations (dbt run)
        run: |
          cd transform
          dbt run

      - name: Execute Data Vault Quality Tests (dbt test)
        run: |
          cd transform
          dbt test